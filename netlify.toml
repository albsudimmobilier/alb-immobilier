[build]
  base = "."
  publish = "alb-final"
  edge_functions = "netlify/edge-functions"

[functions]
  directory = "api"
  node_bundler = "esbuild"

[[redirects]]
  from = "/mentions-legales*"
  to = "/cgu"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
