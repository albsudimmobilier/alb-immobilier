<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace ALB - ALB Immobilier</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem; --space-5: 1.25rem;
      --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;
      --color-bg: #f7f6f2;
      --color-surface: #f9f8f5;
      --color-surface-2: #fbfbf9;
      --color-surface-offset: #f0ede8;
      --color-border: #d4d1ca;
      --color-divider: #dedbd5;
      --color-text: #28251d;
      --color-text-muted: #6f6c66;
      --color-text-faint: #9f9b93;
      --color-text-inverse: #f9f8f4;
      --color-primary: #01696f;
      --color-primary-hover: #0c4e54;
      --color-primary-soft: #dcebea;
      --color-success: #437a22;
      --color-success-soft: #e1ecd9;
      --color-warning: #b06a00;
      --color-warning-soft: #f2e4cf;
      --color-danger: #a13544;
      --color-danger-soft: #f3d9dc;
      --radius-sm: .5rem; --radius-md: .875rem; --radius-lg: 1.25rem; --radius-xl: 1.5rem; --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(25,20,14,.05);
      --shadow-md: 0 8px 24px rgba(25,20,14,.08);
      --transition: 180ms cubic-bezier(.16,1,.3,1);
    }
    [data-theme="dark"] {
      --color-bg: #171614; --color-surface: #1c1b19; --color-surface-2: #201f1d; --color-surface-offset: #262422;
      --color-border: #393836; --color-divider: #302f2d; --color-text: #e4e1db; --color-text-muted: #afaba2;
      --color-text-faint: #7d7972; --color-text-inverse: #11100f; --color-primary: #4f98a3; --color-primary-hover: #72adb6;
      --color-primary-soft: #243739; --color-success: #88bb63; --color-success-soft: #273324; --color-warning: #f0b04b;
      --color-warning-soft: #3d3122; --color-danger: #e1838e; --color-danger-soft: #3f282c; --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
      --shadow-md: 0 8px 24px rgba(0,0,0,.35);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: 'Satoshi', Arial, sans-serif; font-size: var(--text-base); background: var(--color-bg); color: var(--color-text); line-height: 1.5; }
    button, input, select, textarea { font: inherit; }
    a, button { transition: all var(--transition); }
    .dashboard { height: 100dvh; display: grid; grid-template-columns: 280px 1fr; grid-template-rows: auto 1fr; }
    .sidebar { grid-row: 1 / -1; overflow-y: auto; border-right: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); background: color-mix(in srgb, var(--color-surface) 92%, var(--color-primary) 8%); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-6); }
    .brand { display: flex; align-items: center; gap: var(--space-3); }
    .brand-mark { width: 42px; height: 42px; border-radius: 14px; background: var(--color-primary-soft); display: grid; place-items: center; color: var(--color-primary); border: 1px solid color-mix(in srgb, var(--color-primary) 20%, transparent); flex: none; }
    .brand h1 { font-size: var(--text-sm); margin: 0; }
    .brand p { font-size: var(--text-xs); color: var(--color-text-muted); margin: 0; }
    .nav-group { display: grid; gap: var(--space-2); }
    .nav-title { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-faint); margin-bottom: var(--space-2); }
    .nav-item { display: flex; align-items: center; gap: var(--space-3); text-decoration: none; color: var(--color-text); padding: .85rem 1rem; border-radius: var(--radius-md); background: transparent; min-height: 44px; cursor: pointer; border: none; }
    .nav-item:hover, .nav-item.active { background: var(--color-surface-2); box-shadow: var(--shadow-sm); }
    .nav-item.active { color: var(--color-primary); font-weight: 700; }
    .header { grid-column: 2; position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--color-bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); display: flex; justify-content: space-between; align-items: center; padding: var(--space-4) var(--space-6); }
    .header-title h2 { margin: 0; font-size: var(--text-xl); }
    .header-title p { margin: .3rem 0 0; font-size: var(--text-sm); color: var(--color-text-muted); }
    .header-actions { display: flex; gap: var(--space-3); align-items: center; }
    .icon-btn { width: 44px; height: 44px; padding: 0; border-radius: var(--radius-full); border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); background: var(--color-surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .btn-logout { background: #d32f2f; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .btn-logout:hover { background: #b71c1c; }
    .btn-primary { background: var(--color-primary); color: white; padding: 10px 20px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-save { background: var(--color-success); color: white; padding: 10px 20px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; margin-top: var(--space-4); }
    .btn-save:hover { opacity: 0.9; }
    .btn-danger { background: #d32f2f; color: white; padding: 8px 14px; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600; }
    .main { grid-column: 2; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-6); }
    .page { display: grid; gap: var(--space-6); }
    .panel { background: var(--color-surface); border: 1px solid color-mix(in srgb, var(--color-text) 10%, transparent); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-6); }
    .form-group { margin-bottom: var(--space-6); }
    .form-group label { display: block; margin-bottom: var(--space-2); font-weight: 600; font-size: var(--text-sm); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); color: var(--color-text); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); }
    .checkbox-group { display: flex; align-items: center; gap: var(--space-3); }
    .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .section-title { font-size: var(--text-lg); margin: var(--space-6) 0 var(--space-4) 0; font-weight: 600; }
    .empty-msg { color: var(--color-text-muted); font-size: var(--text-sm); }
    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .photo-upload { border: 2px dashed var(--color-primary); border-radius: var(--radius-md); padding: var(--space-6); text-align: center; cursor: pointer; }
    .photo-upload:hover { background: var(--color-primary-soft); }
    .photo-upload input { display: none; }
    .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--space-4); margin-top: var(--space-4); }
    .photo-item { position: relative; border-radius: var(--radius-md); overflow: hidden; }
    .photo-item img { width: 100%; height: 120px; object-fit: cover; }
    .photo-item-remove { position: absolute; top: 5px; right: 5px; background: #d32f2f; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-weight: bold; }
    .annonce-card { background: var(--color-bg); padding: var(--space-4); border-radius: var(--radius-md); border-left: 4px solid var(--color-primary); margin-bottom: var(--space-4); }
    .annonce-card h4 { margin: 0 0 var(--space-2) 0; font-size: var(--text-sm); font-weight: 600; }
    .annonce-meta { font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: var(--space-2); }
    .visite-card { background: var(--color-bg); padding: var(--space-4); border-radius: var(--radius-md); border-left: 4px solid var(--color-warning); margin-bottom: var(--space-4); }
    .visite-status { display: inline-block; font-size: var(--text-xs); padding: 4px 8px; border-radius: 4px; font-weight: 600; }
    .status-attente { background: var(--color-warning-soft); color: var(--color-warning); }
    .status-accepte { background: var(--color-success-soft); color: var(--color-success); }
    .status-refuse { background: var(--color-danger-soft); color: var(--color-danger); }
  </style>
</head>
<body>

<div class="dashboard">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div><h1>ALB</h1><p>Immobilier</p></div>
    </div>
    <nav class="nav-group" id="nav-container"></nav>
    <div style="flex: 1;"></div>
    <button class="btn-logout" onclick="logout()">🚪 Déconnexion</button>
  </aside>

  <header class="header">
    <div class="header-title">
      <h2 id="page-title">Espace ALB</h2>
      <p id="page-desc">Gère tes données</p>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()">🌙</button>
    </div>
  </header>

  <main class="main">
    <div class="page">
      <!-- RECHERCHE ANNONCES -->
      <div id="tab-recherche" class="tab-section">
        <div class="panel">
          <h3 class="section-title">🔍 Rechercher une Annonce</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Budget (€)</label>
              <input type="number" id="search-budget" placeholder="Max: 500000">
            </div>
            <div class="form-group">
              <label>Surface (m²)</label>
              <input type="number" id="search-surface" placeholder="Min: 50">
            </div>
          </div>
          <button class="btn-primary" onclick="searchAnnonces()" style="width: 100%; margin-top: var(--space-4);">🔎 Rechercher</button>
          <div id="annonces-list" style="margin-top: var(--space-6);"></div>
        </div>
      </div>

      <!-- MES ANNONCES (VENDEUR) -->
      <div id="tab-mes-annonces" class="tab-section">
        <div class="panel">
          <h3 class="section-title">📋 Mes Annonces</h3>
          <div id="annonce-form-container"></div>
        </div>
      </div>

      <!-- DISPONIBILITÉS VENDEUR -->
      <div id="tab-disponibilites" class="tab-section">
        <div class="panel">
          <h3 class="section-title">📅 Mes Disponibilités (Réception Acheteurs)</h3>
          <div class="form-group">
            <label>Horaires de réception</label>
            <textarea id="dispo-horaires" placeholder="Ex: Lun-Ven: 14h-18h&#10;Sam: 10h-17h&#10;Dim: Sur RDV"></textarea>
          </div>
          <button class="btn-save" onclick="saveDisponibilites()">💾 Enregistrer</button>
        </div>
      </div>

      <!-- PLANNING VENDEUR -->
      <div id="tab-planning-vendeur" class="tab-section">
        <div class="panel">
          <h3 class="section-title">📅 Mes Visites (Vendeur)</h3>
          <div id="planning-vendeur-list"></div>
        </div>
      </div>

      <!-- MES DEMANDES VISITE (ACHETEUR) -->
      <div id="tab-mes-demandes" class="tab-section">
        <div class="panel">
          <h3 class="section-title">📩 Mes Demandes de Visite</h3>
          <div id="demandes-list"></div>
        </div>
      </div>

      <!-- PLANNING ACHETEUR -->
      <div id="tab-planning-acheteur" class="tab-section">
        <div class="panel">
          <h3 class="section-title">📅 Mes Visites Confirmées (Acheteur)</h3>
          <div id="planning-acheteur-list"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="supabase-client.js"></script>
<script>
  let currentUser = null;
  let userData = null;
  let uploadedPhotos = [];
  let toutesAnnonces = [];

  async function init() {
    const localUser = localStorage.getItem('alb_user');
    if (localUser) {
      currentUser = { id: localUser };
    } else {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
        return;
      }
      currentUser = session.user;
    }
    await loadUserInfo();
  }

  async function loadUserInfo() {
    const { data, error } = await window.supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', currentUser.id)
      .single();

    if (error) {
      console.error('Erreur:', error);
      return;
    }

    userData = data;
    
    const isPro = ['courtier', 'artisan', 'agent', 'mandataire'].includes(userData.role);
    if (isPro) {
      window.location.href = '/alb-final/dashboard-courtier-complet.html';
      return;
    }

    uploadedPhotos = userData.annonce_photos ? JSON.parse(userData.annonce_photos) : [];
    
    renderLayout();
    renderNavigation();
    if (userData.est_vendeur) renderAnnonceForm();
    loadAnnoncesForSearch();
    loadVisites();
  }

  function renderLayout() {
    document.querySelector('.brand p').textContent = 'Particulier';
  }

  function renderNavigation() {
    const container = document.getElementById('nav-container');
    const items = [];

    if (userData.est_acquereur) {
      items.push('<button class="nav-item active" onclick="switchTab(\'recherche\')">🔍 Rechercher</button>');
    }
    
    if (userData.est_vendeur) {
      items.push('<button class="nav-item' + (!userData.est_acquereur ? ' active' : '') + '" onclick="switchTab(\'mes-annonces\')">📋 Mes Annonces</button>');
      items.push('<button class="nav-item" onclick="switchTab(\'disponibilites\')">📅 Disponibilités</button>');
      items.push('<button class="nav-item" onclick="switchTab(\'planning-vendeur\')">📅 Planning Vendeur</button>');
    }

    if (userData.est_acquereur) {
      items.push('<button class="nav-item" onclick="switchTab(\'mes-demandes\')">📩 Mes Demandes</button>');
      items.push('<button class="nav-item" onclick="switchTab(\'planning-acheteur\')">📅 Planning Acheteur</button>');
    }

    container.innerHTML = '<div class="nav-group">' + items.join('') + '</div>';
    
    const firstTab = userData.est_acquereur ? 'recherche' : 'mes-annonces';
    switchTab(firstTab);
  }

  async function loadAnnoncesForSearch() {
    const { data } = await window.supabaseClient
      .from('profiles')
      .select('id, prenom, nom, description, prix, surface_m2, dpe, ges, annonce_photos')
      .eq('est_vendeur', true);
    
    toutesAnnonces = data || [];
  }

  async function searchAnnonces() {
    const budget = document.getElementById('search-budget').value || 999999999;
    const surface = document.getElementById('search-surface').value || 0;
    
    const filtered = toutesAnnonces.filter(a => 
      parseInt(a.prix || 0) <= parseInt(budget) && 
      parseInt(a.surface_m2 || 0) >= parseInt(surface)
    );

    const html = filtered.map(a => {
      const photos = a.annonce_photos ? JSON.parse(a.annonce_photos) : [];
      return `
        <div class="annonce-card">
          <h4>${a.prenom} ${a.nom}</h4>
          <div class="annonce-meta">
            💰 ${a.prix}€ | 📐 ${a.surface_m2}m² | DPE: ${a.dpe || '-'} | GES: ${a.ges || '-'}
          </div>
          <p style="margin: 0 0 var(--space-3) 0; font-size: var(--text-sm);">${a.description || 'Pas de description'}</p>
          ${photos.length > 0 ? `<img src="${photos[0]}" style="width: 100%; height: 150px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: var(--space-3);">` : ''}
          <button class="btn-primary" onclick="openDemande('${a.id}', '${a.prenom} ${a.nom}')" style="width: 100%;">📧 Demander Visite</button>
        </div>
      `;
    }).join('');

    document.getElementById('annonces-list').innerHTML = html || '<p class="empty-msg">Aucune annonce trouvée</p>';
  }

  function renderAnnonceForm() {
    const form = `
      <div class="form-grid">
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" placeholder="Décrivez votre bien...">${userData.description || ''}</textarea>
        </div>
        <div class="form-group">
          <label>Prix (€)</label>
          <input type="number" id="prix" value="${userData.prix || ''}" placeholder="250000">
        </div>
        <div class="form-group">
          <label>Surface (m²)</label>
          <input type="number" id="surface_m2" value="${userData.surface_m2 || ''}" placeholder="85">
        </div>
        <div class="form-group">
          <label>DPE</label>
          <select id="dpe">
            <option value="">--</option>
            <option value="A" ${userData.dpe === 'A' ? 'selected' : ''}>A</option>
            <option value="B" ${userData.dpe === 'B' ? 'selected' : ''}>B</option>
            <option value="C" ${userData.dpe === 'C' ? 'selected' : ''}>C</option>
            <option value="D" ${userData.dpe === 'D' ? 'selected' : ''}>D</option>
            <option value="E" ${userData.dpe === 'E' ? 'selected' : ''}>E</option>
            <option value="F" ${userData.dpe === 'F' ? 'selected' : ''}>F</option>
            <option value="G" ${userData.dpe === 'G' ? 'selected' : ''}>G</option>
          </select>
        </div>
        <div class="form-group">
          <label>GES</label>
          <select id="ges">
            <option value="">--</option>
            <option value="A" ${userData.ges === 'A' ? 'selected' : ''}>A</option>
            <option value="B" ${userData.ges === 'B' ? 'selected' : ''}>B</option>
            <option value="C" ${userData.ges === 'C' ? 'selected' : ''}>C</option>
            <option value="D" ${userData.ges === 'D' ? 'selected' : ''}>D</option>
            <option value="E" ${userData.ges === 'E' ? 'selected' : ''}>E</option>
            <option value="F" ${userData.ges === 'F' ? 'selected' : ''}>F</option>
            <option value="G" ${userData.ges === 'G' ? 'selected' : ''}>G</option>
          </select>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="sous_compromis" ${userData.sous_compromis ? 'checked' : ''}>
        <label for="sous_compromis" style="margin: 0;">Sous compromis</label>
      </div>

      <h3 class="section-title">📸 Photos (max 10)</h3>
      <div class="photo-upload" onclick="document.getElementById('photo-input').click()">
        <p>📤 Cliquer pour ajouter (${uploadedPhotos.length}/10)</p>
        <input type="file" id="photo-input" multiple accept="image/*" onchange="handlePhotoUpload(event)">
      </div>

      <div class="photo-grid" id="photo-grid">
        ${uploadedPhotos.map((url, idx) => `
          <div class="photo-item">
            <img src="${url}" alt="Photo">
            <button class="photo-item-remove" onclick="removePhoto(${idx})">×</button>
          </div>
        `).join('')}
      </div>

      <button class="btn-save" onclick="saveAnnonce()">💾 Enregistrer</button>
    `;
    document.getElementById('annonce-form-container').innerHTML = form;
  }

  async function handlePhotoUpload(event) {
    const files = Array.from(event.target.files);
    if (uploadedPhotos.length + files.length > 10) {
      alert('Max 10 photos!');
      return;
    }

    for (let file of files) {
      if (!file.type.startsWith('image/')) continue;
      const fileName = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).substr(2, 9)}.jpg`;
      const { error: uploadError } = await window.supabaseClient.storage.from('annonces').upload(fileName, file);
      if (uploadError) continue;
      const { data } = window.supabaseClient.storage.from('annonces').getPublicUrl(fileName);
      uploadedPhotos.push(data.publicUrl);
    }
    renderPhotoGrid();
  }

  function removePhoto(idx) {
    uploadedPhotos.splice(idx, 1);
    renderPhotoGrid();
  }

  function renderPhotoGrid() {
    const grid = document.getElementById('photo-grid');
    if (!grid) return;
    grid.innerHTML = uploadedPhotos.map((url, idx) => `
      <div class="photo-item">
        <img src="${url}" alt="Photo">
        <button class="photo-item-remove" onclick="removePhoto(${idx})">×</button>
      </div>
    `).join('');
  }

  async function saveAnnonce() {
    const { error } = await window.supabaseClient.from('profiles').update({
      description: document.getElementById('description').value,
      prix: document.getElementById('prix').value,
      surface_m2: document.getElementById('surface_m2').value,
      dpe: document.getElementById('dpe').value,
      ges: document.getElementById('ges').value,
      sous_compromis: document.getElementById('sous_compromis').checked,
      annonce_photos: JSON.stringify(uploadedPhotos),
    }).eq('id', currentUser.id);

    alert(error ? '❌ Erreur: ' + error.message : '✅ Annonce enregistrée!');
  }

  async function saveDisponibilites() {
    const { error } = await window.supabaseClient.from('profiles').update({
      disponibilites_vendeur: document.getElementById('dispo-horaires').value,
    }).eq('id', currentUser.id);

    alert(error ? '❌ Erreur: ' + error.message : '✅ Disponibilités enregistrées!');
  }

  function openDemande(vendeurId, vendeurNom) {
    const date = prompt(`Quelle date pour visiter chez ${vendeurNom}? (YYYY-MM-DD)`);
    if (!date) return;
    const heure = prompt('Quelle heure? (HH:MM)');
    if (!heure) return;
    
    submitDemande(vendeurId, date, heure);
  }

  async function submitDemande(vendeurId, date, heure) {
    const { error } = await window.supabaseClient.from('visites_programmees').insert({
      vendeur_id: vendeurId,
      acheteur_id: currentUser.id,
      date_visite: date,
      heure_visite: heure,
      statut: 'en_attente',
    });

    if (error) {
      alert('❌ Erreur: ' + error.message);
    } else {
      alert('✅ Demande envoyée!');
      loadVisites();
    }
  }

  async function loadVisites() {
    const { data: visites } = await window.supabaseClient
      .from('visites_programmees')
      .select('*, profiles!vendeur_id(prenom, nom), profiles!acheteur_id(prenom, nom)')
      .or(`vendeur_id.eq.${currentUser.id},acheteur_id.eq.${currentUser.id}`);

    if (userData.est_vendeur) {
      const vendeur = visites?.filter(v => v.vendeur_id === currentUser.id) || [];
      document.getElementById('planning-vendeur-list').innerHTML = vendeur.map(v => `
        <div class="visite-card">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <h4 style="margin: 0;">Visite: ${v.profiles[1]?.prenom} ${v.profiles[1]?.nom}</h4>
              <p style="margin: 4px 0 0; color: var(--color-text-muted); font-size: var(--text-sm);">${v.date_visite} à ${v.heure_visite}</p>
            </div>
            <div>
              <span class="visite-status status-${v.statut}">${v.statut === 'en_attente' ? '⏳ En attente' : v.statut === 'acceptee' ? '✅ Acceptée' : '❌ Refusée'}</span>
            </div>
          </div>
          ${v.statut === 'en_attente' ? `
            <button class="btn-primary" onclick="acceptVisite('${v.id}')" style="margin-top: var(--space-2); margin-right: var(--space-2);">✅ Accepter</button>
            <button class="btn-danger" onclick="refuseVisite('${v.id}')" style="margin-top: var(--space-2);">❌ Refuser</button>
          ` : ''}
        </div>
      `).join('') || '<p class="empty-msg">Aucune visite</p>';
    }

    if (userData.est_acquereur) {
      const acheteur = visites?.filter(v => v.acheteur_id === currentUser.id) || [];
      
      document.getElementById('demandes-list').innerHTML = acheteur.map(v => `
        <div class="visite-card">
          <h4 style="margin: 0;">Demande chez ${v.profiles[0]?.prenom} ${v.profiles[0]?.nom}</h4>
          <p style="margin: 4px 0; color: var(--color-text-muted); font-size: var(--text-sm);">${v.date_visite} à ${v.heure_visite}</p>
          <span class="visite-status status-${v.statut}">${v.statut === 'en_attente' ? '⏳ En attente' : v.statut === 'acceptee' ? '✅ Acceptée' : '❌ Refusée'}</span>
        </div>
      `).join('') || '<p class="empty-msg">Aucune demande</p>';

      const acceptees = visites?.filter(v => v.acheteur_id === currentUser.id && v.statut === 'acceptee') || [];
      document.getElementById('planning-acheteur-list').innerHTML = acceptees.map(v => `
        <div class="visite-card">
          <h4 style="margin: 0;">Visite confirmée chez ${v.profiles[0]?.prenom} ${v.profiles[0]?.nom}</h4>
          <p style="margin: 4px 0; color: var(--color-text-muted); font-size: var(--text-sm);">📅 ${v.date_visite} à ${v.heure_visite}</p>
        </div>
      `).join('') || '<p class="empty-msg">Aucune visite confirmée</p>';
    }
  }

  async function acceptVisite(visteId) {
    const { error } = await window.supabaseClient.from('visites_programmees').update({ statut: 'acceptee' }).eq('id', visteId);
    if (!error) {
      alert('✅ Visite acceptée!');
      loadVisites();
    }
  }

  async function refuseVisite(visteId) {
    const { error } = await window.supabaseClient.from('visites_programmees').update({ statut: 'refusee' }).eq('id', visteId);
    if (!error) {
      alert('❌ Visite refusée');
      loadVisites();
    }
  }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-' + tabId)?.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${tabId}')"]`)?.classList.add('active');
  }

  function toggleTheme() {
    const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  }

  function logout() {
    localStorage.removeItem('alb_user');
    window.location.href = '/login.html';
  }

  init();
</script>

</body>
</html>
