    * { box-sizing: border-box; margin: 0; padding: 0; }

// ---------- Recherche (sans accents, tous les mots) ----------
const sansAccent = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const texteFiche = f => sansAccent(f.t + ' ' + f.theme + ' ' + f.mots + ' ' + f.etapes.join(' ').replace(/<[^>]+>/g, ' ') + ' ' + (f.astuce || ''));
const VIDES = new Set(['je', 'j', 'un', 'une', 'le', 'la', 'les', 'de', 'des', 'du', 'd', 'l', 'a', 'au', 'par', 'pour', 'comment', 'faire', 'quelqu', 'qu', 'un', 'et', 'en', 'mon', 'ma', 'mes']);
let themeChoisi = 'Tout';

function surligner(html, mots) {
  if (!mots.length) return html;
  return html.replace(/>([^<]+)</g, (m, txt) => '>' + txt.replace(/[^\s,.;:!?()«»'’]+/g, w => mots.some(x => sansAccent(w).startsWith(x)) ? '<mark>' + w + '</mark>' : w) + '<');
}

function afficher() {
  const brut = document.getElementById('champ').value;
  const mots = sansAccent(brut).split(/[^a-z0-9]+/).filter(m => m && !VIDES.has(m));
  let res = FICHES.map(f => {
    const tx = texteFiche(f), titre = sansAccent(f.t + ' ' + f.mots);
    let score = 0;
    for (const m of mots) {
      const racine = m.length > 5 ? m.slice(0, m.length - 2) : m;   // inscription ≈ inscrire
      if (titre.includes(racine)) score += 3; else if (tx.includes(racine)) score += 1; else return null;
    }
    return { f, score };
  }).filter(Boolean);
  if (themeChoisi !== 'Tout' && !mots.length) res = res.filter(r => r.f.theme === themeChoisi);
  res.sort((a, b) => b.score - a.score);

  document.getElementById('compte').textContent = mots.length ? res.length + ' fiche(s) trouvée(s)' : res.length + ' fiches';
  const liste = document.getElementById('liste');
  if (!res.length) { liste.innerHTML = '<div class="rien">Rien trouvé 🌿 Essaie un autre mot (par exemple « facture », « code », « annonce »).</div>'; return; }
  const racines = mots.map(m => m.length > 5 ? m.slice(0, m.length - 2) : m);
  liste.innerHTML = res.map((r, i) => {
    const f = r.f;
    const corps = '<ol>' + f.etapes.map(e => '<li>' + e + '</li>').join('') + '</ol>' +
      (f.astuce ? '<div class="astuce">💡 ' + f.astuce + '</div>' : '') +
      '<div class="aller">' + f.aller.map(a => '<a href="' + a[1] + '">' + a[0] + ' →</a>').join('') + '</div>';
    return '<details class="fiche"' + (mots.length && i < 2 ? ' open' : '') + '><summary><span class="fiche-titre">' + surligner('>' + f.t + '<', racines).slice(1, -1) + '</span><span class="fiche-theme">' + f.theme + '</span></summary>' +
      '<div class="fiche-corps">' + surligner(corps, racines) + '</div></details>';
  }).join('');
}

// ---------- Rubriques ----------
const themes = ['Tout', ...new Set(FICHES.map(f => f.theme))];
document.getElementById('themes').innerHTML = themes.map(t => '<button type="button" data-t="' + t + '"' + (t === 'Tout' ? ' class="actif"' : '') + '>' + t + '</button>').join('');
document.getElementById('themes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  themeChoisi = b.dataset.t;
  document.getElementById('champ').value = '';
  document.querySelectorAll('#themes button').forEach(x => x.classList.toggle('actif', x === b));
  afficher();
});
document.getElementById('champ').addEventListener('input', afficher);
afficher();
</script>
